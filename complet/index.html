<title>Carnet de révisions</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#1b2033;--muted:#5d6478;--line:#dfe3ef;--accent:#2546d6;--bad:#c9303e}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--card:#191d29;--ink:#eef0f7;--muted:#a3a9bb;--line:#2c3243;--accent:#6f8cff;--bad:#ff6b77}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 10px 30px rgba(20,30,70,.08);text-align:center}
.card img{width:64px;height:64px}
h1{font-size:1.35rem;margin:12px 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
input[type=password],input[type=text]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
label.rem{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;font-size:.9rem;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<main class="card" id="lock" hidden>
  <img src="../icon-192.png" alt="">
  <h1>Carnet de révisions</h1>
  <p>Tape le mot de passe pour ouvrir ton carnet.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Mot de passe" aria-label="Mot de passe" required>
    <label class="rem"><input type="checkbox" id="rem" checked> Se souvenir sur cet appareil</label>
    <button id="go">Ouvrir</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

var KEY='carnet-complet-mdp';
function norm(p){ return p.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s_]+/g,'-'); }
function bytes(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function open_(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv)},key,bytes(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
function get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
function set(v){ try{ if(v) localStorage.setItem(KEY,v); else localStorage.removeItem(KEY); }catch(e){} }
var lock=document.getElementById('lock'), err=document.getElementById('err'), go=document.getElementById('go');
if(!window.crypto||!crypto.subtle){ lock.hidden=false; err.textContent='Ouvre cette page dans Chrome, Edge ou Safari.'; go.disabled=true; }
else {
  var saved=get();
  (saved?open_(saved).then(show):Promise.reject()).catch(function(){ if(saved) set(null); lock.hidden=false; document.getElementById('pw').focus(); });
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); var pw=document.getElementById('pw').value; err.textContent=''; go.disabled=true; go.textContent='Ouverture…';
    open_(pw).then(function(html){ set(document.getElementById('rem').checked?pw:null); show(html); })
      .catch(function(){ go.disabled=false; go.textContent='Ouvrir'; err.textContent='Mot de passe incorrect.'; });
  });
}
