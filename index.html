<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='6' width='44' height='52' rx='4' fill='%23fdfdff' stroke='%23141c36' stroke-width='4'/%3E%3Cline x1='24' y1='6' x2='24' y2='58' stroke='%23d4303d' stroke-width='3'/%3E%3Cg stroke='%23a9b8ea' stroke-width='3'%3E%3Cline x1='30' y1='20' x2='48' y2='20'/%3E%3Cline x1='30' y1='30' x2='48' y2='30'/%3E%3Cline x1='30' y1='40' x2='48' y2='40'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#2546d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<title>Carnet de révisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;600&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout concept: a modern study-app shell (sticky top nav on desktop, bottom tab bar on phones and tablets)
   around a Seyès-ruled copybook motif: ruled paper in the hero, handwritten question on the flashcards. */
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#eceff9; --sheet:#fdfdff;
  --ink:#121a33; --muted:#5a6486; --line:#dfe4f1;
  --accent:#2c47d8; --accent-ink:#ffffff; --accent-soft:#e6ebfd;
  --margin:#d4303d; --grid:#cfd9f3; --hilite:#ffe45e;
  --ok:#17805a; --ok-soft:#dff3ea; --bad:#c42437; --bad-soft:#fbe3e6;
  --s1:#2c47d8; --s1b:#e6ebfd; --s2:#0f8a6a; --s2b:#dcf3ec; --s3:#b7620a; --s3b:#fdeed8;
  --s4:#c2335a; --s4b:#fbe3ea; --s5:#6d3fd0; --s5b:#ece4fb; --s6:#0e7a9e; --s6b:#dcf1f8;
  --shadow:0 1px 2px rgba(18,26,51,.05),0 10px 28px -14px rgba(18,26,51,.2);
  --shadow-up:0 2px 4px rgba(18,26,51,.06),0 22px 40px -18px rgba(18,26,51,.32);
  --r:16px; --r-sm:11px;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1120; --surface:#151a2f; --surface-2:#1e2540; --sheet:#1a2038;
    --ink:#e9ecf8; --muted:#9ba5c6; --line:#283053;
    --accent:#93a5ff; --accent-ink:#0d1120; --accent-soft:#222c58;
    --margin:#ff6e7a; --grid:#2a3460; --hilite:#6b5d12;
    --ok:#52d0a0; --ok-soft:#14352b; --bad:#ff7d8a; --bad-soft:#3a1d27;
    --s1:#93a5ff; --s1b:#222c58; --s2:#4fd0a6; --s2b:#14362d; --s3:#f0b562; --s3b:#3a2a14;
    --s4:#ff8aa8; --s4b:#3d1f2b; --s5:#b79bff; --s5b:#2d2350; --s6:#5cc8ec; --s6b:#133341;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-up:0 2px 4px rgba(0,0,0,.35),0 22px 40px -18px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1120; --surface:#151a2f; --surface-2:#1e2540; --sheet:#1a2038;
  --ink:#e9ecf8; --muted:#9ba5c6; --line:#283053;
  --accent:#93a5ff; --accent-ink:#0d1120; --accent-soft:#222c58;
  --margin:#ff6e7a; --grid:#2a3460; --hilite:#6b5d12;
  --ok:#52d0a0; --ok-soft:#14352b; --bad:#ff7d8a; --bad-soft:#3a1d27;
  --s1:#93a5ff; --s1b:#222c58; --s2:#4fd0a6; --s2b:#14362d; --s3:#f0b562; --s3b:#3a2a14;
  --s4:#ff8aa8; --s4b:#3d1f2b; --s5:#b79bff; --s5b:#2d2350; --s6:#5cc8ec; --s6b:#133341;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-up:0 2px 4px rgba(0,0,0,.35),0 22px 40px -18px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.grow{flex:1;min-width:0}
.wrapx{max-width:1120px;margin-inline:auto;padding-inline:16px}
.narrow{max-width:880px;margin-inline:auto}
.main{padding-block:28px 120px}
.page.flow{display:flex;flex-direction:column;gap:clamp(32px,5vw,48px)}
.page.flow>.btn.back{align-self:flex-start}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}

/* ---- shell ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.top .wrapx{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;
  font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--muted);font-weight:600}
.nb{width:22px;height:27px;border:1.75px solid var(--ink);border-radius:3px;flex:none;
  background:linear-gradient(to right,transparent 5px,var(--margin) 5px,var(--margin) 6.5px,transparent 6.5px),
  repeating-linear-gradient(to bottom,transparent 0 4px,var(--grid) 4px 5px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.brand:hover .nb{transform:rotate(-6deg)}
.nav{display:none;gap:4px;margin-inline:auto}
.navb{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border:0;border-radius:99px;background:none;
  font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s,background .2s}
.navb:hover{color:var(--ink);background:var(--surface-2)}
.navb[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;
  cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.icon-btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.icon-btn.prof{font-family:var(--f-display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon-btn.prof[aria-current=page]{box-shadow:0 0 0 3px var(--accent-soft)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;grid-template-columns:repeat(6,minmax(0,1fr));
  background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;border-radius:12px;
  font-size:.6rem;font-weight:600;color:var(--muted);cursor:pointer;transition:color .2s,background .2s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabb[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.ic{flex:none}
@media (min-width:1120px){ .nav{display:flex} .tools{margin-left:0} }
@media (max-width:1119px){ .tabbar{display:grid} }
@media (min-width:720px){ .wrapx{padding-inline:24px} }
@media (min-width:1024px){ .wrapx{padding-inline:32px} }

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r-sm);font-weight:600;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s,filter .2s}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 22px -12px var(--accent)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 14px 26px -12px var(--accent)}
.btn.soft{background:var(--tb,var(--accent-soft));border-color:transparent;color:var(--tc,var(--accent))}
.btn.soft:hover{filter:brightness(.97);border-color:transparent}
.btn.lg{min-height:58px;padding:14px 28px;font-size:1.06rem;border-radius:15px}
.btn .ic{transition:transform .2s}
.btn.lg:hover .ic:last-child,.btn.soft:hover .ic:last-child{transform:translateX(4px)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;padding-inline:8px;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;cursor:pointer;font-size:.9rem}
.link.danger{color:var(--bad)}
.lnk{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;
  padding:6px 2px;border-radius:8px;white-space:nowrap;transition:gap .2s}
.lnk:hover{gap:10px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}

/* ---- shared components ---- */
.sico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tb,var(--accent-soft));color:var(--tc,var(--accent))}
.sico.big{width:54px;height:54px;border-radius:15px}
.t1{--tc:var(--s1);--tb:var(--s1b)} .t2{--tc:var(--s2);--tb:var(--s2b)} .t3{--tc:var(--s3);--tb:var(--s3b)}
.t4{--tc:var(--s4);--tb:var(--s4b)} .t5{--tc:var(--s5);--tb:var(--s5b)} .t6{--tc:var(--s6);--tb:var(--s6b)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,30px);box-shadow:var(--shadow)}
.panel>h2{font-size:1.25rem}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sh h2{font-size:1.45rem}
.sh p{color:var(--muted);margin-top:4px;font-size:.95rem}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:750}
.ph p{color:var(--muted);margin-top:6px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pbar{display:block;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--tc,var(--accent))}
.pbar.thin{height:6px;width:100px}
@keyframes grow{from{width:0}}
.mbar{display:flex;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%}
.mbar .m{background:var(--accent)}
.mbar .l{background:color-mix(in srgb,var(--accent) 38%,transparent)}
.tag{font-style:normal;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;margin-left:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;vertical-align:middle}
.due{font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap;text-align:right}
.due.on{color:var(--margin)}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .rt{stroke:var(--surface-2)}
.ring .rv{stroke:var(--accent)}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.rl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rl b{font-family:var(--f-display);font-size:2.7rem;line-height:1;font-weight:750;font-variant-numeric:tabular-nums}
.rl b small{font-size:1.1rem;font-weight:600;margin-left:2px;color:var(--muted)}
.rl span{font-size:.8rem;color:var(--muted);margin-top:6px}
.stat2{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);min-width:0;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s}
.stat2:hover{transform:translateY(-2px);border-color:var(--muted)}
.stat2 b{display:block;font-family:var(--f-display);font-size:1.85rem;line-height:1.05;font-weight:750;font-variant-numeric:tabular-nums}
.stat2 b small{font-size:.95rem;color:var(--muted);font-weight:600}
.stat2 span.l{font-size:.85rem;color:var(--muted)}
.act{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:8px}
.act div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.act i{display:block;width:100%;max-width:30px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:3px;transition:filter .2s}
.act i.zero{background:var(--line)}
.act div:hover i{filter:brightness(1.15)}
.act small{font-size:.72rem;color:var(--muted)}
.act .now small{color:var(--ink);font-weight:700}
@keyframes grow2{from{transform:scaleY(.1);transform-origin:bottom}}
.emptyx{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:28px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.emptyx p{color:var(--muted);max-width:46ch}
.frow{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:16px}
.frow label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;flex:1 1 200px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:13px;padding:4px;background:var(--bg);margin-top:14px}
.segb{border:0;background:none;padding:9px 20px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.segb[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow-up);max-width:calc(100% - 32px)}

/* ---- home ---- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:28px;
  padding:clamp(26px,5vw,60px);border:1px solid var(--line);border-radius:26px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(to right,transparent 13px,var(--margin) 13px,var(--margin) 14.5px,transparent 14.5px),
  repeating-linear-gradient(to bottom,transparent 0 31px,var(--grid) 31px 32px);
  -webkit-mask-image:linear-gradient(100deg,#000 0,transparent 78%);mask-image:linear-gradient(100deg,#000 0,transparent 78%)}
.hcopy{position:relative;z-index:1}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.8rem);font-weight:750;margin:12px 0 14px}
.hl{background:linear-gradient(transparent 62%,var(--hilite) 62%);padding:0 4px;margin:0 -4px}
.lead{font-size:clamp(1.05rem,2.2vw,1.25rem);color:var(--muted);max-width:34ch}
.hcta{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}
.hmeta{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem}
.stack{position:relative;width:min(100%,360px);aspect-ratio:1/.92;margin-inline:auto;z-index:1}
.fc{position:absolute;width:64%;aspect-ratio:3/2;border-radius:16px;border:1px solid var(--line);background-color:var(--sheet);padding:14px 16px 14px 34px;
  background-image:linear-gradient(to right,transparent 22px,var(--margin) 22px,var(--margin) 23px,transparent 23px),
  repeating-linear-gradient(to bottom,transparent 0 21px,var(--grid) 21px 22px);
  box-shadow:var(--shadow-up);transition:transform .45s cubic-bezier(.2,.8,.2,1);animation:floaty 6s ease-in-out infinite}
.fc small{display:block;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;line-height:22px}
.fc p{font-family:var(--f-hand);font-weight:600;font-size:1.45rem;line-height:22px;color:var(--accent)}
.fc.a{left:0;top:8%;transform:rotate(-9deg);animation-delay:-2s}
.fc.b{right:0;top:0;transform:rotate(7deg);animation-delay:-4s}
.fc.c{left:17%;bottom:0;transform:rotate(-2deg);z-index:2}
.fc.b small,.fc.b p{color:var(--margin)}
.fc.b p{font-size:1.2rem}
.stack:hover .fc.a{transform:rotate(-13deg) translateX(-8px)}
.stack:hover .fc.b{transform:rotate(11deg) translateX(8px)}
.stack:hover .fc.c{transform:rotate(0) translateY(-4px)}
.pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{font:700 .68rem var(--f-body);padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.r{color:var(--margin);border-color:var(--margin)}
.pill.g{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pencil{position:absolute;width:44%;right:-2%;bottom:6%;transform:rotate(-24deg);z-index:3;filter:drop-shadow(0 6px 8px rgba(18,26,51,.25))}
.pencil .p1{fill:var(--hilite)} .pencil .p2{fill:#f1d9b5} .pencil .p3{fill:var(--ink)} .pencil .p4{fill:var(--margin)}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -7px}}
.quick{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
.cont{display:flex;flex-direction:column;gap:16px;height:100%}
.cont .top2{display:flex;gap:16px;align-items:center}
.cont h3{font-size:1.25rem;overflow-wrap:anywhere}
.cont .pr{display:flex;align-items:center;gap:12px}
.cont .pr b{font-family:var(--f-display);color:var(--tc)}
.cont .btn{align-self:flex-start;margin-top:auto}
.recos{display:flex;flex-direction:column}
.reco{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.recos>.reco:first-child{border-top:0;padding-top:0}
.recos>.reco:last-child{padding-bottom:0}
.rtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.rtxt b{overflow-wrap:anywhere}
.rtxt span{color:var(--muted);font-size:.88rem}
.progrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,52px);align-items:center}
.ringbox{display:grid;place-items:center}
.stats2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.scard{display:flex;flex-direction:column;gap:12px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.scard:hover{transform:translateY(-4px);box-shadow:var(--shadow-up);border-color:color-mix(in srgb,var(--tc) 45%,var(--line))}
.shead{display:flex;justify-content:space-between;align-items:center}
.spct{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--tc);font-variant-numeric:tabular-nums}
.scard h3{font-size:1.3rem;overflow-wrap:anywhere}
.smeta{color:var(--muted);font-size:.9rem}
.smeta b{color:var(--margin);font-weight:600}
.sact{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
@media (max-width:860px){

}

async function boot(){
  render();

  var db=res[0], user=res[1];
  S.sample=res[2]; S.downloads=res[3];
  var uid=null; try{ uid=user?await user.id():null; }catch(e){}
  var loaded=false, first=false;
  if(db && uid){
    try{
      var pref=db.doc('data/users/'+uid+'/carnet'), col=pref.collection('decks');
      var snap=await pref.get();
      if(snap.exists){
        S.profile=Object.assign({days:{}},clone(snap.data()));
        var q=await col.get();
        S.decks=q.docs.map(function(x){ return Object.assign({id:x.id},clone(x.data())); });
      } else { S.profile={seeded:true,days:{}}; S.decks=examples(); first=true; }
      dbRef={profile:pref,decks:col}; S.persist='cloud'; loaded=true;
    }catch(e){ dbRef=null; }
  }
  if(!loaded){
    var raw=null; try{ raw=localStorage.getItem('carnet-sans-cate-v2'); }catch(e){}
    if(raw){ try{ var p=JSON.parse(raw); S.profile=p.profile||S.profile; S.decks=p.decks||[]; }catch(e){ S.decks=examples(); } }
    else S.decks=examples();
  }
  if(!S.profile.days) S.profile.days={};
  S.draft.pname=S.profile.name||'';
  S.decks.forEach(function(d){ d.cards=d.cards||[]; d.quiz=d.quiz||[]; });
  var toSave=[];
  if(!Array.isArray(S.profile.imported)) S.profile.imported=[];
  presets().forEach(function(p){
    if(S.profile.imported.indexOf(p.id)>-1) return;
    S.profile.imported.push(p.id); toSave.push('profile');
    if(!getDeck(p.id)){ S.decks.push(p); toSave.push('deck:'+p.id); }
  });
  patchKeys().concat(patchLessons()).forEach(function(k){ if(toSave.indexOf(k)<0) toSave.push(k); });
  S.decks.sort(function(a,b){ return (a.t||0)-(b.t||0); });
  if(S.sample){ try{ var lim=await S.sample.limits(); S.imgLimits=lim.images||null; }catch(e){} }
  S.ready=true; render();
  if(first){ queueSave('profile'); S.decks.forEach(function(d){ queueSave('deck:'+d.id); }); }
  else toSave.filter(function(k,i){ return toSave.indexOf(k)===i; }).forEach(queueSave);
}

    if(rev) all.push({p:100+rev+pen,d:d,k:'due',n:rev,min:mins(rev)});
    if(d.lesson && !read[d.id]) all.push({p:65+pen,d:d,k:'lesson',min:5});
    var miss=0, unseen=0; d.quiz.forEach(function(q){ miss+=q.miss||0; if(!q.seen) unseen++; });
    if(miss) all.push({p:80+miss+pen,d:d,k:'quizfix',n:miss,min:Math.max(2,Math.round(d.quiz.length/2))});

/* ---------- maths: generated calculation exercises ---------- */
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function rnz(m){ var n=0; while(!n) n=ri(-m,m); return n; }
function rpm(a,b){ return ri(a,b)*(Math.random()<.5?-1:1); }
function pick1(a){ return a[Math.floor(Math.random()*a.length)]; }
function fmt(n){ return (n<0?'−':'')+String(Math.abs(n)).replace('.',','); }
function rel(n){ return '('+(n<0?'−':'+')+Math.abs(n)+')'; }
function term(n){ return (n<0?'− ':'+ ')+Math.abs(n); }
function addSteps(a,t){
  var s=a+t, A=Math.abs(a), T=Math.abs(t);
  if(a===-t) return 'Ce sont deux nombres opposés : leur somme est nulle.\nRésultat : 0';
  if((a<0)===(t<0)) return 'Termes de même signe : je garde le signe « '+(a<0?'−':'+')+' » et j’ajoute les distances à zéro : '+A+' + '+T+' = '+(A+T)+'.\nRésultat : '+fmt(s);
  return 'Termes de signes différents : je prends le signe de '+fmt(A>T?a:t)+' (la plus grande distance à zéro) et je soustrais les distances à zéro : '+Math.max(A,T)+' − '+Math.min(A,T)+' = '+Math.abs(s)+'.\nRésultat : '+fmt(s);
}
var TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25],[15,20,25],[20,21,29],[9,40,41]];
function tri(){
  var n=pick1(['ABC','DEF','RST','MNP','IJK','EFG','KLM']), L=n.split(''), r=ri(0,2);
  L=[L[r]].concat(L.filter(function(_,i){ return i!==r; }));
  function seg(x,y){ return [x,y].sort().join(''); }
  return {name:n,R:L[0],L:L,s1:seg(L[0],L[1]),s2:seg(L[0],L[2]),h:seg(L[1],L[2])};
}
function triFig(t,v1,v2,vh){
  function lab(v,x,y,anc){ return '<text x="'+x+'" y="'+y+'" text-anchor="'+anc+'" class="'+(v==='?'?'unk':'val')+'">'+esc(v)+'</text>'; }
  return '<figure class="fig cfig"><svg viewBox="0 0 280 180" role="img" aria-label="Triangle '+t.name+' rectangle en '+t.R+'"><polygon class="t" points="50,140 50,30 230,140"/><polyline class="t" points="50,122 68,122 68,140"/>'
    +'<text x="32" y="158">'+t.L[0]+'</text><text x="32" y="30">'+t.L[1]+'</text><text x="238" y="152">'+t.L[2]+'</text>'
    +lab(v1,42,92,'end')+lab(v2,140,166,'middle')+lab(vh,148,78,'start')+'</svg><figcaption>Figure à main levée</figcaption></figure>';
}
function pythIntro(t){ return 'Dans le triangle '+t.name+' rectangle en '+t.R+', d’après le théorème de Pythagore :\n'+t.h+'² = '+t.s1+'² + '+t.s2+'²\n'; }
var GEN={
  r_simp:function(){
    var a=rnz(15), b=rnz(15), op=Math.random()<.5?'+':'−', t=op==='+'?b:-b, same=(op==='+')===(b>0);
    return {kind:'num',tag:'Je simplifie, puis je calcule',q:fmt(a)+' '+op+' '+rel(b),ans:a+t,
      steps:'Les signes « '+op+' » et « '+(b<0?'−':'+')+' » se suivent : '+(same?'ils sont identiques, je les remplace par « + »':'ils sont différents, je les remplace par « − »')+'.\n'+fmt(a)+' '+op+' '+rel(b)+' = '+fmt(a)+' '+term(t)+'\n'+addSteps(a,t)};
  },
  r_calc:function(){ var a=rnz(20), t=rnz(20); return {kind:'num',tag:'Addition et soustraction',q:fmt(a)+' '+term(t),ans:a+t,steps:addSteps(a,t)}; },
  r_chain:function(){
    var a=rnz(12), b=rnz(12), c=rnz(12), ab=a+b;
    return {kind:'num',tag:'Calcul en chaîne',q:fmt(a)+' '+term(b)+' '+term(c),ans:ab+c,steps:'Je calcule de gauche à droite.\n'+fmt(a)+' '+term(b)+' = '+fmt(ab)+'\n'+fmt(ab)+' '+term(c)+' = '+fmt(ab+c)+'\nRésultat : '+fmt(ab+c)};
  },
  r_mul:function(){
    var a=rpm(2,12), b=rpm(2,12), same=(a<0)===(b<0), p=a*b;
    return {kind:'num',tag:'Multiplication',q:rel(a)+' × '+rel(b),ans:p,steps:'Les signes sont '+(same?'les mêmes : le résultat est positif.':'différents : le résultat est négatif.')+'\n'+Math.abs(a)+' × '+Math.abs(b)+' = '+Math.abs(p)+'\nRésultat : '+fmt(p)};
  },
  r_div:function(){
    var b=rpm(2,10), q=rpm(2,12), a=b*q, same=(a<0)===(b<0);
    return {kind:'num',tag:'Division',q:rel(a)+' ÷ '+rel(b),ans:q,steps:'Les signes sont '+(same?'les mêmes : le résultat est positif.':'différents : le résultat est négatif.')+'\n'+Math.abs(a)+' ÷ '+Math.abs(b)+' = '+Math.abs(q)+'\nRésultat : '+fmt(q)};
  },
  r_sign:function(){
    var n=ri(3,5), f=[], k=0;

var GEO=null, GU=40, LET='ABCDEFGHIJKLMNPQRSTUVWXYZ';

  if(center && !used.O) return 'O';

function d2(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
function r1(v){ return Math.round(v*10)/10; }
function lenTxt(v){ var r=r1(v); return (Math.abs(v-r)>1e-6?'≈ ':'')+fmt(r)+' cm'; }
function sqTxt(v){ var r=Math.round(v*100)/100; return (Math.abs(v-r)>1e-9?'≈ ':'')+fmt(r); }
function centroid(P){ var x=0,y=0; P.forEach(function(p){ x+=p.x; y+=p.y; }); return {x:x/P.length,y:y/P.length}; }
function lenLabel(a,b,P,prefix,down){
  var U=GU, mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.sqrt(dx*dx+dy*dy)||1, nx=-dy/L, ny=dx/L;
  if(P){ var c=centroid(P); if(nx*(mx-c.x)+ny*(my-c.y)<0){ nx=-nx; ny=-ny; } } else if(down?ny<0:ny>0){ nx=-nx; ny=-ny; }

function rightMarks(P){
  var s='', U=GU, k=.42;

    var ux=a.x-p.x, uy=a.y-p.y, vx=b.x-p.x, vy=b.y-p.y, lu=Math.sqrt(ux*ux+uy*uy), lv=Math.sqrt(vx*vx+vy*vy);

  });
  if(g.cur&&g.tool!=='move'&&g.tool!=='erase') s+='<circle class="gcur" cx="'+g.cur.x*U+'" cy="'+g.cur.y*U+'" r="4"/>';

}
var GTIPS={move:'Fais glisser un point pour modifier la figure. Clique sur une figure pour voir ses mesures.',point:'Clique sur la grille pour placer un point.',seg:'Clique sur deux points pour tracer un segment.',poly:'Clique sur chaque sommet, puis à nouveau sur le premier point pour fermer la figure (ou appuie sur Entrée).',circ:'Clique sur le centre, puis sur un point du cercle.',erase:'Clique sur un point ou sur une figure pour l’effacer.'};
function geoRow(k,v){ return '<div class="gl"><span>'+k+'</span><b>'+v+'</b></div>'; }
function geoInfo(){
  var g=GEO, o=g.sel&&geoObj(g.sel), tip='<p class="gtip'+(g.pending.length?' on':'')+'">'+GTIPS[g.tool]+'</p>', h='';
  if(!o) return '<h3>Mesures</h3><p class="muted small">Choisis l’outil Déplacer et clique sur une figure pour voir ses longueurs, ses angles et le test de Pythagore.</p>'+tip;
  if(o.t==='seg'){
    var a=gp(o.a), b=gp(o.b);
    h='<h3>Segment ['+esc(a.n+b.n)+']</h3>'+geoRow('Longueur',lenTxt(Math.sqrt(d2(a,b))));
  } else if(o.t==='circ'){
    var c=gp(o.c), p=gp(o.p), r=Math.sqrt(d2(c,p));
    h='<h3>Cercle de centre '+esc(c.n)+'</h3>'+geoRow('Rayon',lenTxt(r))+geoRow('Diamètre',lenTxt(2*r))+geoRow('Périmètre','≈ '+fmt(r1(2*Math.PI*r))+' cm')+geoRow('Aire','≈ '+fmt(r1(Math.PI*r*r))+' cm²');
  } else {
    var P=o.ids.map(gp).filter(Boolean), n=P.length, nm=P.map(function(q){ return q.n; }).join('');
    var sides=P.map(function(q,i){ var q2=P[(i+1)%n]; return {nm:q.n+q2.n,a:q,b:q2,sq:d2(q,q2)}; });
    var per=0, area=0;

  var wc=function(x){ return x.split(/\s+/).length; }, out=[];

    if(wc(part)<=15){ out.push(part); return; }
    var cur='';
    part.split(/(?<=,)\s+/).forEach(function(q){ cur=cur?cur+' '+q:q; if(wc(cur)>=7){ out.push(cur); cur=''; } });
    if(cur) out.push(cur);
  });
  var res=[];

}

/* ---------- catéchisme: liturgical year ---------- */
function easter(y){
  var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  var h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);

    {d:addD(E,-46),n:'Mercredi des Cendres',c:'violet'},{d:ann,n:'Annonciation',c:'blanc'},
    {d:addD(E,-7),n:'Dimanche des Rameaux',c:'rouge'},{d:addD(E,-3),n:'Jeudi saint',c:'blanc'},{d:addD(E,-2),n:'Vendredi saint',c:'rouge'},

    {d:new Date(y,7,15),n:'Assomption',c:'blanc'},{d:new Date(y,10,1),n:'Toussaint',c:'blanc'},

/* ---------- reading mode ---------- */
function escRe(x){ return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
var CZ_STOP={dieu:1,plus:1,moins:1,oui:1,non:1,signe:1,signes:1,meme:1,tres:1,tout:1,avec:1,pour:1,dans:1,sont:1,jesus:1,christ:1,esprit:1,eglise:1,terre:1,amour:1,bien:1,actions:1,pere:1,mains:1,vrai:1,faux:1};
function lessonRe(d){
  var seen={}, terms=[];
  d.cards.forEach(function(c){ (keySets(c.k)||[]).forEach(function(set){ set.forEach(function(g){ g.split('|').forEach(function(alt){
    alt=alt.trim(); var n=norm(alt);
    if(seen[n]||CZ_STOP[n]) return;
    if(isNumTerm(alt)?alt.replace(/\D/g,'').length<3:n.replace(/[^a-z]/g,'').length<4) return;
    seen[n]=1; terms.push(alt);
  }); }); }); });
  if(!terms.length) return null;
  terms.sort(function(a,b){ return b.length-a.length; });
  return new RegExp('(?<![\\p{L}\\p{N}])((?:'+terms.map(escRe).join('|')+')(?:s|x)?)(?![\\p{L}\\p{N}])','giu');
}
function readTime(d){ var w=0; (d.lesson||[]).forEach(function(s){ s.i.forEach(function(it){ var t=it.t; if(Array.isArray(t)) t=t.join(' '); if(typeof t==='string') w+=t.split(/\s+/).length; }); }); return Math.max(1,Math.round(w/170)); }

function readerBody(d,hide,rev){
  var re=lessonRe(d), n=0;

      var lab={def:'Définition',rule:'Propriété',ex:'Exemple'}[it.k];
      if(lab) return '<div class="lbox '+it.k+'"><span class="llab">'+lab+'</span><p>'+cz(it.t,used)+'</p></div>';

  return {html:html,count:n};

/* ---------- new chapter from photos: Claude reads the pages, then writes lesson, cards, quiz and sheet ---------- */
var PH_MAX=30;
function phState(){ if(!S.ph) S.ph={files:[],thumbs:[],subj:'',chap:'',nc:15,nq:10,busy:false,step:'',pct:0,err:'',text:'',res:null}; return S.ph; }
function phReset(keepSubj){ var s=S.ph||{}; S.ph=null; var n=phState(); if(keepSubj) n.subj=s.subj||''; return n; }
function phThumb(file){
  if(!window.createImageBitmap) return Promise.resolve(null);
  return createImageBitmap(file).then(function(b){
    var r=Math.min(1,180/Math.max(b.width,b.height)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(b.width*r)); c.height=Math.max(1,Math.round(b.height*r));
    c.getContext('2d').drawImage(b,0,0,c.width,c.height); if(b.close) b.close();
    return c.toDataURL('image/jpeg',0.7);
  }).catch(function(){ return null; });
}
function phAdd(list){
  var P=phState(), lim=S.imgLimits, skipped=0;
  Array.prototype.slice.call(list||[]).forEach(function(f){
    if(P.files.length>=PH_MAX){ skipped++; return; }
    if(lim&&lim.mediaTypes&&lim.mediaTypes.indexOf(f.type)<0){ skipped++; return; }
    if(lim&&lim.maxInputBytes&&f.size>lim.maxInputBytes){ skipped++; return; }
    P.files.push(f); P.thumbs.push(null);
    var idx=P.files.length-1;
    phThumb(f).then(function(u){ if(P.files[idx]!==f) return; P.thumbs[idx]=u; var im=document.querySelector('.phth[data-i="'+idx+'"] .phimg'); if(im&&u){ im.style.backgroundImage='url('+u+')'; im.innerHTML=''; } });
  });
  P.res=null; P.err=skipped?(skipped+' photo'+(skipped>1?'s':'')+' ignorée'+(skipped>1?'s':'')+' (format non accepté, trop lourde ou plus de '+PH_MAX+' photos).'):'';
  render();
}
function phEntry(subj){ var P=phState(); if(!P.busy&&!P.res&&subj!=null) P.subj=subj; S.sess=null; go({name:'photos',from:subj?'cate':'subjects'}); }

function phStatus(t,p){ var P=S.ph; if(!P) return; P.step=t; if(p!=null) P.pct=p; var el=document.getElementById('phstep'); if(el) el.textContent=t; var b=document.getElementById('phbar'); if(b) b.style.width=P.pct+'%'; }
var PH_KINDS={p:1,def:1,rule:1,ex:1,list:1};
function phClean(r){
  var str=function(x){ return typeof x==='string'?x.trim():''; };
  var lesson=(r&&Array.isArray(r.lesson)?r.lesson:[]).map(function(s){
    var items=(s&&Array.isArray(s.i)?s.i:[]).map(function(it){
      if(!it||!PH_KINDS[it.k]) it={k:'p',t:it&&it.t};
      if(it.k==='list'){ var a=(Array.isArray(it.t)?it.t:String(it.t||'').split('\n')).map(str).filter(Boolean); return a.length?{k:'list',t:a}:null; }
      var t=Array.isArray(it.t)?it.t.map(str).join('\n'):str(it.t); return t?{k:it.k,t:t}:null;
    }).filter(Boolean);
    return items.length?{h:str(s.h)||'Partie',i:items}:null;
  }).filter(Boolean);
  var cards=(r&&Array.isArray(r.cards)?r.cards:[]).filter(function(c){ return c&&str(c.q)&&str(c.a); }).map(function(c){
    var k=Array.isArray(c.k)?c.k.map(String).map(function(x){ return x.trim(); }).filter(Boolean).slice(0,4):null;
    return {q:str(c.q),a:str(c.a),k:k&&k.length?k:null,keep:true};
  });
  var quiz=(r&&Array.isArray(r.quiz)?r.quiz:[]).filter(function(q){ var n=Number(q&&q.answer); return q&&str(q.q)&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(n)&&n>=0&&n<Math.min(4,q.options.length); })
    .map(function(q){ return {q:str(q.q),o:q.options.slice(0,4).map(String),a:Number(q.answer),why:String(q.why||''),keep:true}; });
  var f=r&&r.fiche||{}, fiche={};
  var arr=function(a){ return Array.isArray(a)?a.map(str).filter(Boolean).slice(0,10):[]; };
  if(arr(f.sum).length) fiche.sum=arr(f.sum);
  if(arr(f.trap).length) fiche.trap=arr(f.trap);
  var terms=Array.isArray(f.terms)?f.terms.filter(function(t){ return Array.isArray(t)&&str(t[0])&&str(t[1]); }).map(function(t){ return [str(t[0]),str(t[1])]; }).slice(0,10):[];
  if(terms.length) fiche.terms=terms;
  return {title:str(r&&r.title).slice(0,60),lesson:lesson,cards:cards,quiz:quiz,fiche:Object.keys(fiche).length?fiche:null};
}
async function phRead(){
  var P=phState(), per=Math.max(1,(S.imgLimits&&S.imgLimits.maxCount)||3), n=P.files.length, parts=[];
  for(var i=0;i<n;i+=per){
    var batch=P.files.slice(i,i+per), a=i+1, b=Math.min(n,i+per);
    phStatus('Lecture des photos '+(a===b?a:a+' à '+b)+' sur '+n+'…',Math.round(5+55*i/n));
    var prompt='Voici '+(batch.length>1?batch.length+' photos':'une photo')+' (photos '+a+' à '+b+' sur '+n+') de pages d’un cours de collège (classe de 4e), en français : manuel, cahier ou feuille d’un élève.\n'
      +'Recopie fidèlement TOUT le texte lisible, photo par photo, dans l’ordre de lecture. Avant chaque photo, écris une ligne « === Photo X === » (X = son numéro sur '+n+'), et si un numéro de page est visible, ajoute « (page N) ».\n'
      +'Marque les titres avec « # » et les listes avec « - ». Recopie les tableaux ligne par ligne avec « | » entre les colonnes. Décris en une ligne entre crochets les schémas et figures utiles, par exemple [Schéma : …]. Écris [illisible] pour un passage qu’on ne peut pas lire.\n'
      +'N’ajoute aucun commentaire, aucune explication, aucune mise en forme markdown en dehors de ces repères.';
    var r=await S.sample(prompt,sonnet({images:batch,signal:ctl.signal,cache:false}));
    parts.push((r&&r.text||'').trim());
  }
  return parts.join('\n\n');
}
async function phGenerate(){
  var P=phState();
  phStatus('Claude écrit la leçon, les cartes et le quiz…',62);
  var prompt='Tu aides un élève de 4e (collège, France) à réviser. Voici le texte recopié depuis des photos de son cours'+(P.subj?' de « '+P.subj+' »':'')+(P.chap?', chapitre « '+P.chap+' »':'')+'. Les photos ont pu être prises dans le désordre : si des numéros de page apparaissent, remets le contenu dans le bon ordre.\n\n'
    +'Écris en français, sans markdown :\n'
    +'1. "lesson" : la leçon remise au propre, fidèle et complète, découpée en 3 à 8 parties avec un titre chacune. Chaque partie contient des éléments {"k":type,"t":texte}. Types : "def" pour une définition, "rule" pour une propriété, une règle ou un point à retenir, "ex" pour un exemple ou un exercice corrigé (étapes séparées par des retours à la ligne), "list" pour une liste ("t" est alors un tableau de phrases), "p" pour un paragraphe. Garde mot pour mot les passages à apprendre par cœur. Corrige seulement les erreurs de lecture évidentes ; n’ajoute rien qui ne soit pas dans le cours.\n'
    +'2. "cards" : '+P.nc+' cartes de révision (question courte, réponse concise et exacte) qui couvrent toute la leçon. "k" liste 1 à 4 mots indispensables pour qu’une réponse courte compte comme juste ; mets des synonymes acceptés séparés par « | » dans le même élément, par exemple "observe|respecte".\n'
    +'3. "quiz" : '+P.nq+' questions à choix multiple, 4 propositions, une seule bonne, mauvaises réponses plausibles, courte explication dans "why". Varie la position de la bonne réponse.\n'
    +'4. "fiche" : une fiche de révision d’une page. "sum" : 5 à 8 phrases courtes avec l’essentiel. "terms" : les mots-clés avec une définition courte. "trap" : 2 à 4 pièges ou confusions à éviter.\n'
    +'5. "title" : le titre du chapitre, court (moins de 50 caractères).\n\n'
    +'Réponds uniquement avec un objet JSON de cette forme : {"title":"...","lesson":[{"h":"...","i":[{"k":"def","t":"..."},{"k":"list","t":["...","..."]}]}],"cards":[{"q":"...","a":"...","k":["..."]}],"quiz":[{"q":"...","options":["...","...","...","..."],"answer":0,"why":"..."}],"fiche":{"sum":["..."],"terms":[["mot","définition"]],"trap":["..."]}}\n\n'
    +'Texte du cours :\n'+P.text.slice(0,150000);
  var r=await S.sample.json(prompt,sonnet({signal:ctl.signal,cache:false,onText:function(u){ var k=u.text.length; phStatus('Claude écrit la leçon, les cartes et le quiz… ('+k+' caractères)',Math.min(97,62+Math.round(k/250))); }}));
  var res=phClean(r);
  if(!res.lesson.length&&!res.cards.length) throw {code:'empty'};
  return res;
}
async function phRun(again){
  var P=phState(); if(!S.sample||P.busy) return;
  if(!again&&!P.files.length){ P.err='Ajoute au moins une photo de ton cours.'; render(); return; }
  P.busy=true; P.err=''; P.res=null; P.pct=3; P.step='Préparation…'; ctl=new AbortController(); render();
  try{
    if(!again||!P.text){ P.text=await phRead(); }
    if(!P.text.replace(/\[illisible\]|=== Photo.*===|\s/g,'')) throw {code:'unreadable'};
    P.res=await phGenerate();
    if(!P.chap) P.chap=P.res.title;
  }catch(e){
    if(!e||e.code!=='cancelled') P.err=e&&e.code==='unreadable'?'Claude n’a pas réussi à lire les photos. Reprends-les bien à plat, nettes et éclairées.'
      :e&&e.code==='empty'?'Claude n’a rien proposé de lisible. Réessaie, ou ajoute des photos plus nettes.'
      :GEN_ERR[e&&e.code]||'La création a échoué. Réessaie dans un instant.';
  }
  P.busy=false; ctl=null; render(); window.scrollTo(0,0);
}

async function xfSave(){
  var X=xfState(), P=xfPayload(); X.err=''; X.msg='';
  if(!P.decks.length){ X.err='Coche au moins un chapitre.'; render(); return; }
  var text=JSON.stringify(P);
  if(S.downloads){
    try{ await S.downloads.save({filename:xfName('json'),data:text}); X.msg='Fichier enregistré. Envoie-le sur ton autre appareil, puis importe-le là-bas.'; render(); return; }
    catch(e){
      if(e&&e.code==='rejected_extension'){ try{ await S.downloads.save({filename:xfName('txt'),data:text}); X.msg='Fichier enregistré. Envoie-le sur ton autre appareil, puis importe-le là-bas.'; render(); return; }catch(e2){ e=e2; } }
      if(e&&(e.code==='declined')){ return; }
    }

/* validation of an imported file: keep only well-formed data */
function xfStr(x,max){ return typeof x==='string'?x.slice(0,max||4000):''; }
function xfNum(x,d){ x=Number(x); return isFinite(x)?x:d; }
function xfDay(x){ return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:today(); }
function xfLesson(L){
  if(!Array.isArray(L)) return null;
  var kinds={p:1,def:1,rule:1,ex:1,list:1,table:1,heart:1,fig:1};
  var out=L.slice(0,40).map(function(s){
    if(!s||!Array.isArray(s.i)) return null;
    var items=s.i.slice(0,80).map(function(it){
      if(!it||!kinds[it.k]) return null;
      if(it.k==='fig') return {k:'fig'};
      if(it.k==='list') return Array.isArray(it.t)?{k:'list',t:it.t.map(function(x){ return xfStr(x); }).filter(Boolean)}:null;
      if(it.k==='table') return Array.isArray(it.head)&&Array.isArray(it.rows)?{k:'table',head:it.head.map(function(x){ return xfStr(x,200); }),rows:it.rows.filter(Array.isArray).map(function(r){ return r.map(function(x){ return xfStr(x,400); }); })}:null;
      var t=xfStr(it.t); return t?{k:it.k,t:t}:null;
    }).filter(Boolean);
    return items.length?{h:xfStr(s.h,200)||'Partie',i:items}:null;
  }).filter(Boolean);
  return out.length?out:null;
}
function xfFiche(f){
  if(!f||typeof f!=='object') return null;
  var arr=function(a){ return Array.isArray(a)?a.map(function(x){ return xfStr(x,600); }).filter(Boolean).slice(0,12):null; };
  var o={}; if(arr(f.sum)&&arr(f.sum).length) o.sum=arr(f.sum); if(arr(f.trap)&&arr(f.trap).length) o.trap=arr(f.trap);
  if(Array.isArray(f.terms)){ var t=f.terms.filter(function(x){ return Array.isArray(x)&&xfStr(x[0])&&xfStr(x[1]); }).map(function(x){ return [xfStr(x[0],200),xfStr(x[1],600)]; }).slice(0,12); if(t.length) o.terms=t; }
  return Object.keys(o).length?o:null;
}
function xfDeck(o){
  if(!o||!xfStr(o.name)||!Array.isArray(o.cards)) return null;
  var cards=o.cards.slice(0,500).filter(function(c){ return c&&xfStr(c.q)&&xfStr(c.a); }).map(function(c){
    var n={id:xfStr(c.id,40)||rid(),q:xfStr(c.q),a:xfStr(c.a),due:xfDay(c.due),ivl:Math.max(0,xfNum(c.ivl,0)),ease:Math.min(3.5,Math.max(1.3,xfNum(c.ease,2.5))),reps:Math.max(0,xfNum(c.reps,0)|0),lapses:Math.max(0,xfNum(c.lapses,0)|0)};
    if(Array.isArray(c.k)) n.k=c.k.map(function(x){ return Array.isArray(x)?x.map(function(y){ return xfStr(y,200); }):xfStr(x,200); }).slice(0,8);
    if(c.lg!=null) n.lg=xfNum(c.lg,0); if(xfStr(c.la,10)) n.la=xfStr(c.la,10);

  });
  var quiz=(Array.isArray(o.quiz)?o.quiz:[]).slice(0,300).filter(function(q){ return q&&xfStr(q.q)&&Array.isArray(q.o)&&q.o.length>=2&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length; })
    .map(function(q){ return {id:xfStr(q.id,40)||rid(),q:xfStr(q.q),o:q.o.slice(0,6).map(function(x){ return xfStr(x,600); }),a:q.a,why:xfStr(q.why),seen:Math.max(0,xfNum(q.seen,0)|0),miss:Math.max(0,xfNum(q.miss,0)|0)}; });
  var id=typeof o.id==='string'&&/^[\w-]{1,60}$/.test(o.id)?o.id:'d'+rid()+rid();
  return {id:id,name:xfStr(o.name,120),ex:false,t:xfNum(o.t,Date.now()),cards:cards,quiz:quiz,lesson:xfLesson(o.lesson),fiche:xfFiche(o.fiche)};

function xfRead(text){
  var X=xfState(), data; X.err=''; X.msg=''; X.imp=null;
  try{ data=JSON.parse(String(text||'').trim()); }catch(e){ X.err='Ce fichier n’est pas un export du carnet.'; render(); return; }
  if(!data||data.app!==XF_APP||!Array.isArray(data.decks)){ X.err='Ce fichier n’est pas un export du carnet.'; render(); return; }
  var decks=data.decks.map(xfDeck).filter(Boolean);
  if(!decks.length){ X.err='Ce fichier ne contient aucun chapitre.'; render(); return; }

function xfFile(f){

var AI_MODEL='claude-sonnet-5-5';

  S.genBusy=true; S.genErr=''; S.gen=null; ctl=new AbortController(); render();
  var nc=+S.draft.genCards||8, nq=+S.draft.genQuiz;
  var prompt='Tu aides un élève à réviser. À partir du cours ci-dessous'+(S.files.length?' et des photos de notes jointes':'')+', écris '+nc+' cartes de révision (question courte, réponse concise) et '+nq+' questions à choix multiple (4 propositions, une seule bonne, mauvaises réponses plausibles, courte explication). Reste fidèle au contenu fourni, n’invente rien, écris en français, sans mise en forme markdown. Réponds uniquement avec un objet JSON de cette forme : {"cards":[{"q":"...","a":"...","k":["1 à 3 mots indispensables à la réponse"]}],"quiz":[{"q":"...","options":["...","...","...","..."],"answer":0,"why":"..."}]} où "answer" est l’indice (de 0 à 3) de la bonne proposition ; varie sa position.\n\nCours :\n'+text.slice(0,60000);

    var quiz=(r&&r.quiz||[]).filter(function(q){ return q && typeof q.q==='string' && Array.isArray(q.options) && q.options.length>=2 && Number.isInteger(Number(q.answer)) && Number(q.answer)>=0 && Number(q.answer)<Math.min(4,q.options.length); }).map(function(q){ return {q:q.q.trim(),o:q.options.slice(0,4).map(String),a:Number(q.answer),why:String(q.why||''),keep:true}; });

      lines.forEach(function(l){
        if(!l.trim()) return;
        var seps=['\t','::',' ; ',';'], cut=-1, len=0;
        for(var i=0;i<seps.length;i++){ var p=l.indexOf(seps[i]); if(p>0){ cut=p; len=seps[i].length; break; } }
        if(cut<0){ bad++; return; }
        var qq=l.slice(0,cut).trim(), aa=l.slice(cut+len).trim();
        if(qq&&aa){ deck.cards.push(mkCard(qq,aa)); ok++; } else bad++;
      });
      S.flash=ok?(pl(ok,'carte importée','cartes importées')+(bad?', '+pl(bad,'ligne ignorée','lignes ignorées'):'')+'.'):'Aucune ligne reconnue. Écris « question ; réponse » sur chaque ligne.';
      if(ok){ S.draft.bulk=''; queueSave('deck:'+deck.id); }
      render(); break;
    case 'card-del': deck.cards=deck.cards.filter(function(c){return c.id!==d.id;}); queueSave('deck:'+deck.id); render(); break;
    case 'q-del': deck.quiz=deck.quiz.filter(function(c){return c.id!==d.id;}); queueSave('deck:'+deck.id); render(); break;
    case 'card-edit': S.editing=d.id; render(); var eq=document.getElementById('eq'); if(eq) eq.focus(); break;
    case 'card-cancel': S.editing=null; render(); break;
    case 'card-save':
      var nq2=document.getElementById('eq').value.trim(), na=document.getElementById('ea').value.trim(), nk=textToK(document.getElementById('ek').value);
      if(nq2&&na){ deck.cards.forEach(function(c){ if(c.id===d.id){ c.q=nq2; c.a=na; if(nk) c.k=nk; else delete c.k; } }); queueSave('deck:'+deck.id); }
      S.editing=null; render(); break;
    case 'rename':
      var r=(S.draft.rename||'').trim(); if(!r) break;
      deck.name=r; queueSave('deck:'+deck.id); render(); break;
    case 'reset-ask': S.confirm='reset'; render(); break;
    case 'del-ask': S.confirm='del'; render(); break;
    case 'confirm-cancel': S.confirm=null; render(); break;
    case 'reset-yes':
      deck.cards=deck.cards.map(function(c){ return mkCardKeep(c); });
      deck.quiz.forEach(function(q){ q.seen=0; q.miss=0; });
      S.confirm=null; queueSave('deck:'+deck.id); S.flash='Progression remise à zéro.'; S.view.tab='cards'; render(); break;
    case 'del-yes':
      var id=deck.id; S.decks=S.decks.filter(function(x){return x.id!==id;}); queueSave('deck:'+id); go({name:'subjects'}); showToast('Chapitre supprimé.'); break;
  }
}
function mkCardKeep(c){ var n={id:c.id,q:c.q,a:c.a,due:today(),ivl:0,ease:2.5,reps:0,lapses:0}; if(c.k) n.k=c.k; return n; }

/* ---------- events ---------- */
$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b||!$app.contains(b)) return;
  if(b.disabled) return;
  act(b.dataset.a,b.dataset,b);
});
$app.addEventListener('input',function(e){ var k=e.target.dataset&&e.target.dataset.draft; if(k) S.draft[k]=e.target.value; var pf=e.target.dataset&&e.target.dataset.phf; if(pf){ var P=phState(); P[pf]=(pf==='nc'||pf==='nq')?+e.target.value:e.target.value; } });
$app.addEventListener('dragover',function(e){ var z=e.target.closest&&e.target.closest('#phdrop'); if(z){ e.preventDefault(); z.classList.add('over'); } });
$app.addEventListener('dragleave',function(e){ var z=e.target.closest&&e.target.closest('#phdrop'); if(z) z.classList.remove('over'); });
$app.addEventListener('drop',function(e){ var z=e.target.closest&&e.target.closest('#phdrop'); if(z){ e.preventDefault(); z.classList.remove('over'); phAdd(e.dataTransfer&&e.dataTransfer.files); } });
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.draft) S.draft[t.dataset.draft]=t.value;
  if(t.dataset&&t.dataset.phf){ var Pc=phState(); Pc[t.dataset.phf]=(t.dataset.phf==='nc'||t.dataset.phf==='nq')?+t.value:t.value; }
  if(t.dataset&&t.dataset.xffile){ xfFile(t.files&&t.files[0]); t.value=''; return; }
  if(t.dataset&&t.dataset.phfiles){ phAdd(t.files); t.value=''; return; }
  if(t.dataset&&t.dataset.files){
    var max=S.imgLimits?S.imgLimits.maxCount:3;
    S.files=Array.prototype.slice.call(t.files||[]).slice(0,max);
    var el=document.getElementById('filelist'); if(el) el.textContent=S.files.length?S.files.map(function(f){return f.name;}).join(', '):'Aucune photo choisie.';
  }
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t && t.matches && t.matches('input,textarea,select')){
    if(t.id==='typed'&&(e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')&&!t.value&&S.sess&&S.sess.log&&S.sess.log.length){ e.preventDefault(); undoRate(); return; }
    if(e.key==='Enter' && !e.shiftKey && t.dataset.enter){ e.preventDefault(); act(t.dataset.enter,{},t); }
    return;
  }
  if(!S.sess && S.view.name==='geo'){ geoKey(e); return; }
  var s=S.sess; if(!s||s.finished) return;
  var onBtn=t && t.closest && t.closest('button,a');
  if(s.type==='pray'){
    if(e.key==='Escape'){ act('end-session',{}); return; }
    if(e.key==='Enter'&&s.res){ e.preventDefault(); prayNext(); }
    return;
  }
  if(s.type==='calc'){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var ci=s.items[s.i];
    if(e.key==='Escape'){ act('end-session',{}); return; }
    if(e.key==='Enter'){ e.preventDefault(); if(s.res) calcNext(); else if(ci.kind==='num') calcSubmit(); return; }
    if(e.key===' '){ e.preventDefault(); return; }
    if(s.res) return;
    if(ci.kind==='choice'){ if(/^[1-9]$/.test(e.key)&&+e.key<=ci.choices.length) calcChoose(+e.key-1); else { var cd=/^(Digit|Numpad)([1-9])$/.exec(e.code||''); if(cd&&+cd[2]<=ci.choices.length) calcChoose(+cd[2]-1); } return; }
    var dg=/^(Digit|Numpad)([0-9])$/.exec(e.code||'');
    if(dg||/^[0-9]$/.test(e.key)){ e.preventDefault(); var kk=dg?dg[2]:e.key; calcKey(kk); flashKey(kk); return; }
    if(e.code==='NumpadSubtract'||e.code==='Minus'||e.key==='-'||e.key==='−'){ e.preventDefault(); calcKey('neg'); flashKey('neg'); return; }
    if(e.key===','||e.key==='.'||e.code==='NumpadDecimal'){ e.preventDefault(); calcKey('dot'); flashKey('dot'); return; }
    if(e.key==='Backspace'){ e.preventDefault(); calcKey('back'); flashKey('back'); return; }
    if(e.key==='Delete'){ e.preventDefault(); calcKey('clear'); return; }
    return;
  }
  if(s.type==='review'){
    if(e.key==='Escape'){ act('end-session',{}); return; }
    if((e.key===' '||e.key==='Enter') && !onBtn && !s.flipped){ e.preventDefault(); if(typeOn()){ var ta=document.getElementById('typed'); if(ta) ta.focus(); } else act('flip',{}); return; }
    if((e.key==='z'||e.key==='Z')&&!e.altKey){ e.preventDefault(); undoRate(); return; }
    var rk=/^(Digit|Numpad)([1-4])$/.exec(e.code||''), rv=rk?+rk[2]:(/^[1-4]$/.test(e.key)?+e.key:0);
    if(s.flipped && rv && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); act('rate',{g:String(rv-1)}); }
  } else {
    if(e.key==='Escape'){ act('end-session',{}); return; }
    if(s.picked==null && /^[1-4]$/.test(e.key) && +e.key<=s.order.length) act('pick',{i:String(+e.key-1)});
    else if(s.picked!=null && (e.key===' '||e.key==='Enter') && !onBtn){ e.preventDefault(); act('next-q',{}); }
  }
});

$app.addEventListener('pointerdown',function(e){ if(GEO && e.target.closest && e.target.closest('#geosvg')) geoDown(e); });
$app.addEventListener('pointermove',function(e){ if(GEO && !S.sess && S.view.name==='geo' && (GEO.drag || (e.target.closest && e.target.closest('#geosvg')))) geoMove(e); });
window.addEventListener('pointerup',geoUp); window.addEventListener('pointercancel',geoUp);
var rsT=null, rsW=window.innerWidth<640;
window.addEventListener('resize',function(){ clearTimeout(rsT); rsT=setTimeout(function(){ var w=window.innerWidth<640; if(w!==rsW){ rsW=w; if(!S.sess&&S.view.name==='geo') render(); } },150); });

boot();
})();
</script>
